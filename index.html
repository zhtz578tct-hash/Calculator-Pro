<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:12px;overflow:hidden}
.shell{width:100%;max-width:390px;background:#121214;border-radius:32px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06);overflow:hidden;display:flex;flex-direction:column;min-height:640px}
.top{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.dot{width:12px;height:12px;border-radius:50%}.dots{display:flex;gap:7px}
.title{font-size:13px;letter-spacing:0.08em;color:rgba(255,255,255,0.35);font-weight:600}
.display{background:#0a0a0b;margin:8px 14px 12px;border-radius:18px;border:1px solid rgba(255,255,255,0.06);box-shadow:inset 0 2px 12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.03);padding:14px 16px 12px;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end}
.expr{font-size:15px;color:rgba(255,255,255,0.38);text-align:right;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result{font-size:38px;font-weight:300;text-align:right;letter-spacing:-0.02em;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f5f5f0}
.pad{padding:0 12px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button.btn{height:62px;border-radius:14px;border:1px solid rgba(255,255,255,0.07);font-size:22px;font-weight:400;color:#E8E8E8;background:#2B2B2E;box-shadow:0 3px 0 #161618,0 4px 10px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.06);transition:transform .08s,box-shadow .08s;background .08s;user-select:none;position:relative}
button.btn:active{transform:translateY(3px);box-shadow:0 0 0 #161618,0 1px 4px rgba(0,0,0,0.4),inset 0 1px 3px rgba(0,0,0,0.5);background:#232326}
button.fn{background:#3F3F46;color:#fff;border-color:rgba(255,255,255,0.08);box-shadow:0 3px 0 #26262b,0 4px 10px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.07)}
button.fn:active{background:#35353d;box-shadow:0 0 0 #26262b}
button.op{background:linear-gradient(180deg,#D97706 0%,#B45309 100%);color:#fff;font-weight:500;border-color:rgba(0,0,0,0.2);box-shadow:0 3px 0 #78350F,0 4px 12px rgba(217,119,6,0.28),inset 0 1px 0 rgba(255,255,255,0.18);font-size:24px}
button.op:active{background:#92400E;box-shadow:0 0 0 #78350F;transform:translateY(3px)}
button.eq{background:linear-gradient(180deg,#F59E0B 0%,#D97706 100%);color:#fff;font-weight:600;box-shadow:0 3px 0 #92400E,0 6px 16px rgba(245,158,11,0.35),inset 0 1px 0 rgba(255,255,255,0.22)}
button.zero{grid-column:span 2}
.sci-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 10px}
.sci-row button{height:42px;font-size:13px;border-radius:11px;background:#1E1E21;color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.06);box-shadow:0 2px 0 #111113,0 2px 6px rgba(0,0,0,0.4)}
.sci-row button:active{transform:translateY(2px);box-shadow:none}
.mode{display:flex;gap:6px;padding:0 14px 10px}
.mode button{flex:1;height:30px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.05em;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.4)}
.mode button.active{background:#fff;color:#000;border-color:#fff}
.conv{padding:0 14px 18px;display:none;flex:1}
.conv.show{display:flex;flex-direction:column}
.row{display:flex;gap:8px;margin-bottom:8px}
select.sel{flex:1;height:40px;border-radius:12px;background:#1E1E21;color:#fff;border:1px solid rgba(255,255,255,0.08);padding:0 10px;font-size:13px}
input.inp{flex:1;height:40px;border-radius:12px;background:#0A0A0B;color:#fff;border:1px solid rgba(255,255,255,0.08);padding:0 12px;font-size:15px}
.quick{margin-top:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px}
.quick-title{font-size:10px;letter-spacing:0.07em;color:rgba(255,255,255,0.35);margin-bottom:10px;font-weight:700}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qitem{background:#1E1E21;border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,255,0.04)}
.qk{font-size:10px;color:rgba(255,255,255,0.45)} .qv{font-size:13px;color:#fff;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="dots"><div class="dot" style="background:#FF5F57"></div><div class="dot" style="background:#FFBD2E"></div><div class="dot" style="background:#28CA42"></div></div>
    <div class="title">CALCULATOR PRO</div>
    <div style="width:36px"></div>
  </div>
  <div class="mode">
    <button id="mStd" class="active" onclick="setMode('std')">STD</button>
    <button id="mSci" onclick="setMode('sci')">SCI</button>
    <button id="mConv" onclick="setMode('conv')">UNITS</button>
  </div>
  <div class="display" onclick="copyResult()">
    <div id="expr" class="expr"></div>
    <div id="result" class="result">0</div>
  </div>
  <div id="sciRow" class="sci-row" style="display:none">
    <button onclick="add('sin(')">sin</button>
    <button onclick="add('cos(')">cos</button>
    <button onclick="add('tan(')">tan</button>
    <button onclick="add('sqrt(')">√</button>
    <button onclick="add('log(')">log</button>
    <button onclick="add('ln(')">ln</button>
    <button onclick="add('pi')">π</button>
    <button onclick="add('e')">e</button>
    <button onclick="add('^')">^</button>
    <button onclick="add('(')">(</button>
    <button onclick="add(')')">)</button>
    <button onclick="add('!')">!</button>
  </div>
  <div class="pad" id="pad">
    <button class="btn fn" onclick="press('ac')">AC</button>
    <button class="btn fn" onclick="press('c')">C</button>
    <button class="btn fn" onclick="press('%')">%</button>
    <button class="btn op" onclick="press('/')">÷</button>
    <button class="btn" onclick="press('7')">7</button>
    <button class="btn" onclick="press('8')">8</button>
    <button class="btn" onclick="press('9')">9</button>
    <button class="btn op" onclick="press('*')">×</button>
    <button class="btn" onclick="press('4')">4</button>
    <button class="btn" onclick="press('5')">5</button>
    <button class="btn" onclick="press('6')">6</button>
    <button class="btn op" onclick="press('-')">−</button>
    <button class="btn" onclick="press('1')">1</button>
    <button class="btn" onclick="press('2')">2</button>
    <button class="btn" onclick="press('3')">3</button>
    <button class="btn op" onclick="press('+')">+</button>
    <button class="btn zero" onclick="press('0')">0</button>
    <button class="btn" onclick="press('.')">.</button>
    <button class="btn eq" onclick="press('=')">=</button>
  </div>
  <div id="convBox" class="conv">
    <div class="row"><select id="cat" class="sel" onchange="renderUnits()"><option value="length">Length</option><option value="land">Land - UP Bigha</option><option value="weight">Weight</option><option value="temp">Temperature</option></select></div>
    <div class="row"><input id="fromVal" class="inp" value="1" oninput="doConv()"><select id="fromUnit" class="sel" onchange="doConv()"></select></div>
    <div class="row"><input id="toVal" class="inp" readonly><select id="toUnit" class="sel" onchange="doConv()"></select></div>
    <div id="quickRef" class="quick">
      <div class="quick-title" id="quickTitle">ALL CONVERSIONS</div>
      <div class="qgrid" id="quickGrid"></div>
    </div>
  </div>
</div>
<script>
let actx=null;
function tick(type){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type='sine';
    let f=900, d=0.06;
    if(type==='op'){f=600;d=0.07}
    if(type==='eq'){f=700;d=0.12; o.frequency.exponentialRampToValueAtTime(350, actx.currentTime+d);}
    else o.frequency.value=f;
    g.gain.setValueAtTime(0.22,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+d);
    o.start(); o.stop(actx.currentTime+d);
    if(navigator.vibrate) navigator.vibrate(10);
  }catch(e){}
}
let exprStr='';
function update(){
  document.getElementById('expr').textContent=exprStr||'';
  try{
    if(!exprStr) {document.getElementById('result').textContent='0'; return;}
    const v=evalSafe(exprStr);
    document.getElementById('result').textContent=fmt(v);
  }catch{ document.getElementById('result').textContent=exprStr.slice(-12) || '0';}
}
function evalSafe(s){
  let t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/pi/g,'Math.PI');
  t=t.replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/sqrt\(/g,'Math.sqrt(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/\^/g,'**');
  t=t.replace(/(\d+)!/g,(_,n)=>{let r=1;for(let i=2;i<=+n;i++)r*=i;return r});
  t=t.replace(/e(?![a-zA-Z0-9])/g,'Math.E');
  return Function('"use strict";return ('+t+')')();
}
function fmt(n){
  if(!isFinite(n)) return 'Error';
  if(Math.abs(n)<1e-9) return '0';
  const s=n.toString();
  if(s.length>12){
    if(Math.abs(n)>=1e9 || Math.abs(n)<1e-6) return n.toExponential(6);
    return parseFloat(n.toPrecision(10)).toString();
  }
  return s;
}
function press(k){
  if('0123456789.'.includes(k)) tick('num'); else if(k==='=') tick('eq'); else tick('op');
  if(k==='ac'){exprStr='';update();return;}
  if(k==='c'){exprStr=exprStr.slice(0,-1);update();return;}
  if(k==='='){
    try{const v=evalSafe(exprStr); exprStr=fmt(v); update();}catch{ document.getElementById('result').textContent='Error';}
    return;
  }
  if(k==='%'){exprStr+='/100'; update(); return;}
  exprStr+=k; update();
}
function add(s){ tick('op'); exprStr+=s; update(); }
function setMode(m){
  document.getElementById('mStd').classList.toggle('active',m==='std');
  document.getElementById('mSci').classList.toggle('active',m==='sci');
  document.getElementById('mConv').classList.toggle('active',m==='conv');
  document.getElementById('sciRow').style.display=m==='sci'?'grid':'none';
  document.getElementById('pad').style.display=m==='conv'?'none':'grid';
  document.getElementById('convBox').classList.toggle('show',m==='conv');
  if(m==='conv') renderUnits();
}
function copyResult(){ navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('result').textContent); tick('op'); }
const units={
 length:[
  {id:'m',l:'Meter',f:1},
  {id:'km',l:'Kilometer',f:1000},
  {id:'cm',l:'Centimetre',f:0.01},
  {id:'mm',l:'Millimetre',f:0.001},
  {id:'ft',l:'Feet',f:0.3048},
  {id:'in',l:'Inch',f:0.0254},
  {id:'yd',l:'Yard',f:0.9144},
  {id:'mi',l:'Mile',f:1609.34}
 ],
 land:[
  {id:'sqm',l:'Sq Meter',f:1},
  {id:'sqft',l:'Sq Feet',f:0.092903},
  {id:'sqyd',l:'Sq Yard',f:0.836127},
  {id:'acre',l:'Acre',f:4046.86},
  {id:'hect',l:'Hectare',f:10000},
  {id:'bigha_up',l:'Bigha UP (Pucca)',f:2529.29},
  {id:'biswa',l:'Biswa (20/Kari)',f:126.4645},
  {id:'kari',l:'Kari / Kadi (कड़ी)',f:6.32322},
  {id:'dismil',l:'Dismil',f:40.4686},
  {id:'katha',l:'Katha (UP)',f:126.4645}
 ],
 weight:[
  {id:'kg',l:'Kilogram',f:1},
  {id:'g',l:'Gram',f:0.001},
  {id:'mg',l:'Milligram',f:0.000001},
  {id:'lb',l:'Pound',f:0.453592},
  {id:'oz',l:'Ounce',f:0.0283495},
  {id:'q',l:'Quintal',f:100},
  {id:'t',l:'Tonne',f:1000},
  {id:'l',l:'Litre (water ~1kg)',f:1}
 ],
 temp:[{id:'c',l:'Celsius'},{id:'f',l:'Fahrenheit'}]
};
function renderUnits(){
  const cat=document.getElementById('cat').value;
  const list=units[cat];
  const fu=document.getElementById('fromUnit'), tu=document.getElementById('toUnit');
  fu.innerHTML=''; tu.innerHTML='';
  list.forEach(u=>{let o=document.createElement('option');o.value=u.id;o.textContent=u.l;fu.appendChild(o);let o2=o.cloneNode(true);tu.appendChild(o2);});
  tu.selectedIndex=1; doConv();
}
function doConv(){
  const cat=document.getElementById('cat').value, fv=parseFloat(document.getElementById('fromVal').value)||0;
  const from=document.getElementById('fromUnit').value, to=document.getElementById('toUnit').value;
  if(cat==='temp'){
    let c=from==='c'?fv:(fv-32)*5/9;
    let out=to==='c'?c:c*9/5+32;
    document.getElementById('toVal').value=out.toFixed(2);
    document.getElementById('quickRef').style.display='none';
    return;
  }
  const list=units[cat];
  const fObj=list.find(x=>x.id===from); const tObj=list.find(x=>x.id===to);
  if(!fObj||!tObj) return;
  const base=fv*fObj.f; const out=base/tObj.f;
  document.getElementById('toVal').value=parseFloat(out.toFixed(6)).toString();
  buildQuick(fv, from, to, cat);
}
function buildQuick(fv, fromId, toId, cat){
  const list=units[cat];
  const fromObj=list.find(x=>x.id===fromId);
  if(!fromObj) return;
  const base=fv*fromObj.f;
  const grid=document.getElementById('quickGrid');
  grid.innerHTML='';
  document.getElementById('quickTitle').textContent = fv + ' ' + fromObj.l + ' = OTHER UNITS';
  document.getElementById('quickRef').style.display='block';
  list.forEach(u=>{
    if(u.id===fromId || u.id===toId) return;
    const val=base/u.f;
    let txt = Math.abs(val) >= 10000 ? val.toExponential(3) : (Math.abs(val) < 0.0001 && val!=0 ? val.toExponential(3) : parseFloat(val.toFixed(4)).toString());
    const div=document.createElement('div');
    div.className='qitem';
    div.innerHTML='<div class="qk">'+u.l+'</div><div class="qv">'+txt+'</div>';
    div.onclick=()=>{document.getElementById('toUnit').value=u.id; doConv();};
    grid.appendChild(div);
  });
}
renderUnits();
update();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
